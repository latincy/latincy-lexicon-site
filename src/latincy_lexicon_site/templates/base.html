<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LatinCy Lexicon{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/site.css?v={{ site_version }}">
  <script src="https://unpkg.com/htmx.org@2.0.2" defer></script>
  <script src="/static/site.js?v={{ site_version }}" defer></script>
</head>
<body>
  <header>
    <a href="/" class="brand">LatinCy <span class="brand-lexicon">Lexicon</span></a>
    <nav>
      <a href="/docs">API docs</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <small>
      Built on <a href="https://github.com/latincy/latincy-lexicon">latincy-lexicon</a>
      + <a href="https://huggingface.co/latincy">LatinCy</a>.
      Latincy-lexicon builds on Whitaker's
      <a href="https://mk270.github.io/whitakers-words/">Words</a>.
      Written by <a href="https://github.com/diyclassics">P.&nbsp;J.&nbsp;Burns</a> + Claude Opus&nbsp;4.7.
    </small>
  </footer>
</body>
</html>
