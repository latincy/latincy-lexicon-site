{% extends "base.html" %}
{% block title %}Sign in — LatinCy Lexicon{% endblock %}
{% block content %}
<section style="max-width:24rem; margin:4rem auto;">
  <h1 style="margin-bottom:1.5rem;">Sign in</h1>
  {% if error %}
  <p style="color:#c00; margin-bottom:1rem;">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" style="display:flex; flex-direction:column; gap:0.75rem;">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username" style="font-weight:500;">Username</label>
    <input id="username" type="text" name="username" required autofocus autocomplete="username"
           style="padding:0.6rem 0.8rem; font:inherit; border:1px solid #767676; border-radius:4px;">
    <label for="password" style="font-weight:500;">Password</label>
    <input id="password" type="password" name="password" required autocomplete="current-password"
           style="padding:0.6rem 0.8rem; font:inherit; border:1px solid #767676; border-radius:4px;">
    <button type="submit"
            style="margin-top:0.5rem; padding:0.75rem; background:var(--accent); color:#fff; border:none; border-radius:4px; font:inherit; font-size:1rem; cursor:pointer;">
      Sign in
    </button>
  </form>
</section>
{% endblock %}
