{% extends "base.html" %}

{% block content %}
<p class="lede">
  Enter a Latin word in any form to look up its dictionary entry.
</p>

<form action="/word/" method="get" class="lookup" onsubmit="this.action='/word/'+encodeURIComponent(this.elements['form'].value.trim()); this.elements['form'].name=''; return true;">
  <label for="word-input" class="visually-hidden">Latin word to look up</label>
  <input type="text" id="word-input" name="form"
         placeholder="e.g. amabam"
         lang="la"
         required autofocus>
  <button type="submit">Look up</button>
</form>

<p><small>Examples:
  <a href="/word/amabam">amabam</a> ·
  <a href="/word/arma">arma</a> ·
  <a href="/word/pulchrae">pulchrae</a>
</small></p>
{% endblock %}
